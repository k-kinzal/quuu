# The quality gate (docs/working.md) on every push to main, and a Windows build.
#
# - macos-15 because pretest builds quuu-pty with xcrun
# - The gate's tests drive POSIX processes, so Windows proves the build (typecheck, the native
#   helpers, the bundle) and the Windows platform rules, not the whole suite
# - Type-aware ESLint OOMs on the hosted runner's ~2GB default heap
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Gitleaks for hook integration tests
        run: brew install gitleaks

      - name: Lint
        run: npm run lint

      - name: Architecture
        run: npm run check:architecture

      - name: Generated API and compatibility
        run: npm run api:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  windows:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      # zig cc builds the native helpers (terminal host, process probe) for x64 and arm64
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Windows launch and packaging rules
        run: npx vitest run apps/mac/tests/windowsPlatform.test.ts apps/mac/tests/packagedModules.test.ts
