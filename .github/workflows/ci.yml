# The quality gate (docs/working.md) on every push to main.
#
# - macos-15 because pretest builds quuu-pty with xcrun
# - Type-aware ESLint OOMs on the hosted runner's ~2GB default heap
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Architecture
        run: npm run check:architecture

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
