# Build the Mac app and put a dmg on Releases.
#
# - Runs when a GitHub Release is published; attaches (or replaces) the dmg on that Release
# - workflow_dispatch creates no Release; it only verifies the build passes and inspects artifacts
# - Signing defaults to ad-hoc (unsigned distribution). To use an Apple Developer
#   Program certificate, put CSC_LINK (base64 of the .p12) and CSC_KEY_PASSWORD in
#   the repo Secrets and electron-builder switches to proper signing (its standard hook)
# - The iPhone app is not released. Signed distribution needs the Apple Developer
#   Program, so build and install it locally (apps/mobile/ios/install.sh)
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # Type-aware ESLint otherwise OOMs on the hosted runner's ~2GB default heap
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The quality gate is commit-time (docs/working.md). Re-running it here
      # OOMs ESLint, flakes timing tests, and delays the dmg by minutes.

      # The Release tag is the version. Stamp it onto apps/mac/package.json so the
      # dmg name and the built app match what was published; git's version is ignored.
      - name: Stamp version from Release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "tag ${TAG} is not v<semver>" >&2; exit 1 ;;
          esac
          npm pkg set "version=${TAG#v}" -w quuu

      # --publish never lives in the dist:dmg script. Passing it here as
      # `npm run dist:dmg -- --publish never` lets npm eat --publish.
      - name: Build (arm64 / x64 dmg)
        env:
          # No certificate here, so stop the keychain search (afterPack's ad-hoc signing covers it).
          # With CSC_LINK / CSC_KEY_PASSWORD in Secrets, electron-builder signs properly
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # Empty secrets still arrive as "" and electron-builder treats CSC_LINK
          # as a file path, which resolves to the app directory ("not a file").
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          npm run dist:dmg

      - name: Attach dmg to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" apps/mac/release/Quuu-*.dmg --clobber

      # Manual runs create no Release; just keep the outputs as workflow Artifacts
      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: apps/mac/release/Quuu-*.dmg
