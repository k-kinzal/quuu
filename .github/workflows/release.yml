# Build the Mac and Windows apps and publish installers and automatic-update feeds on Releases.
#
# - Runs when a GitHub Release is published; attaches the dmg, zip and feeds to that Release,
#   and the Windows installers, zips and feeds (x64 / arm64) beside them
# - workflow_dispatch creates no Release; it only verifies the build passes and inspects artifacts
# - Signing defaults to ad-hoc (unsigned distribution). To use an Apple Developer
#   Program certificate, put CSC_LINK (base64 of the .p12) and CSC_KEY_PASSWORD in
#   the repo Secrets and electron-builder switches to proper signing (its standard hook)
# - Windows signing works the same way: WIN_CSC_LINK (base64 of the .pfx) and
#   WIN_CSC_KEY_PASSWORD in Secrets sign the executables and installers. Without them the
#   build is unsigned (SmartScreen asks once) and still updates itself
# - The iPhone app is not released. Signed distribution needs the Apple Developer
#   Program, so build and install it locally (apps/mobile/ios/install.sh)
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # Type-aware ESLint otherwise OOMs on the hosted runner's ~2GB default heap
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The quality gate runs on push via ci.yml. This job only packages.

      # The Release tag is the version, dated as YYYY.MM.DD (e.g. 2026.09.26). Stamp it
      # onto apps/mac/package.json without leading zeroes so app and feed versions match.
      - name: Stamp version from Release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          npx vite-node -c vitest.config.ts apps/mac/scripts/release-manifest.ts --stamp

      # --publish never lives in the script; assets are uploaded after all builds finish.
      - name: Build (arm64 / x64 dmg and zip)
        env:
          # No certificate here, so stop the keychain search (afterPack's ad-hoc signing covers it).
          # With CSC_LINK / CSC_KEY_PASSWORD in Secrets, electron-builder signs properly
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # Empty secrets still arrive as "" and electron-builder treats CSC_LINK
          # as a file path, which resolves to the app directory ("not a file").
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          npm run dist:release

      - name: Generate automatic-update feeds
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npx vite-node -c vitest.config.ts apps/mac/scripts/release-manifest.ts --write

      - name: Attach installers, then update feeds to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" apps/mac/release/Quuu-*.dmg apps/mac/release/Quuu-*.zip --clobber
          # Publishing feeds last prevents clients from requesting a not-yet-uploaded ZIP.
          gh release upload "$TAG" apps/mac/release/RELEASES-*.json --clobber

      # Manual runs create no Release; just keep the outputs as workflow Artifacts
      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            apps/mac/release/Quuu-*.dmg
            apps/mac/release/Quuu-*.zip

  release-windows:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      # zig cc builds the native helpers (terminal host, process probe) for x64 and arm64
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install dependencies
        run: npm ci

      - name: Stamp version from Release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npx vite-node -c vitest.config.ts apps/mac/scripts/release-manifest.ts --stamp

      - name: Build (x64 / arm64 installers and zips)
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # Empty secrets still arrive as "" and electron-builder treats the link as a file path.
          if [ -z "${WIN_CSC_LINK:-}" ]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          npm run dist:release

      - name: Generate automatic-update feeds
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npx vite-node -c vitest.config.ts apps/mac/scripts/release-manifest.ts --write-windows

      - name: Attach installers and zips, then update feeds to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" apps/mac/release/Quuu-*-win-*-setup.exe apps/mac/release/Quuu-*-win-*.zip --clobber
          # Publishing feeds last prevents clients from requesting a not-yet-uploaded installer.
          gh release upload "$TAG" apps/mac/release/RELEASES-win32-*.json --clobber

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            apps/mac/release/Quuu-*-win-*-setup.exe
            apps/mac/release/Quuu-*-win-*.zip
