appId: net.kinzal.quuu
productName: Quuu
# Packaged local builds must never opt into the Release update channel.
extraMetadata:
  quuuDistribution: local
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
# Dock image for dev launches. main reads it from process.resourcesPath/build.
extraResources:
  - from: proto/quuu.proto
    to: api/quuu.proto
  # CLI that calls the local API from AI agents and the terminal. Its launcher is per platform.
  - from: out/cli
    to: bin
  # The built-in QuuuAI project runs here (main/projects/builtIn.ts): its own agent instructions,
  # separate from the repository's, and the repository's skills. The checkout reaches the skills
  # through a symlink; the bundle holds real files.
  - from: quuu-ai
    to: quuu-ai
    filter:
      - AGENTS.md
      - CLAUDE.md
  - from: ../../skills
    to: quuu-ai/skills
  - from: build
    to: build
    filter:
      - icon.png
      # Badge for the GitHub App. GitHub only takes it from a human, so the
      # creation flow has to be able to hand the file over.
      - github-app-logo.png
  # The iPhone screens. The Mac distributes them via iCloud, so they **live inside
  # the Mac app** (what gets distributed maps one-to-one to the running Quuu build)
  - from: ../mobile/dist
    to: mobile-web
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  extraResources:
    - from: bin/quuu
      to: bin/quuu
    # Pseudo-terminal host for the built-in terminal. Node pipes cannot handle interactive CLIs or screen size.
    - from: build/pty/quuu-pty
      to: bin/quuu-pty
    # Layered icon (Liquid Glass) for macOS 26+. CFBundleIconName resolves to this,
    # so it sits directly under Contents/Resources. Pre-26 falls back to icon.icns.
    - from: build/Assets.car
      to: Assets.car
  target:
    - target: dmg
      arch: [arm64, x64]
  darkModeSupport: true
  extendInfo:
    LSUIElement: false
    NSAppleEventsUsageDescription: Used by Quuu to perform terminal operations.
    # macOS asks before an app reaches its local network: a host announces itself and serves
    # its paired computers, and a satellite listens for and connects to its host.
    NSLocalNetworkUsageDescription: Used by Quuu to find and connect to the Quuu on your other computers.
    # Icon name inside build/Assets.car (= the name of build/icon.icon)
    CFBundleIconName: icon
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
# Windows: an installer plus a zip to run without installing. x64 only; Windows on Arm runs it emulated.
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  extraResources:
    - from: bin/quuu.cmd
      to: bin/quuu.cmd
    # The same pseudo-terminal contract over ConPTY (native/quuu-pty-win.c)
    - from: build/pty/quuu-pty.exe
      to: bin/quuu-pty.exe
nsis:
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
# Make the .app launchable even without a certificate (public CI). Rationale in the script.
afterPack: scripts/adhoc-sign.mjs
npmRebuild: false
